name: travel_cc
description: "Aplicación de navegación y telemetría para transporte pesado."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Estado y navegación
  provider: ^6.1.2
  go_router: ^14.2.0

  # Inyección de dependencias
  get_it: ^7.7.0
  injectable: ^2.4.4

  # Mapa (OpenStreetMap sin API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generación de código
  build_runner: ^2.4.11
  injectable_generator: ^2.6.2

flutter:
  uses-material-design: true